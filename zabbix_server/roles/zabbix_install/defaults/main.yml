---
zabbix_version: "alpine-7.4-latest"
zabbix_stack_dir: "/opt/zabbix-stack"

zabbix_db_name: "zabbix"
zabbix_db_user: "zabbix"
zabbix_db_password: "zabbix"

zabbix_php_timezone: "Europe/Moscow"

zabbix_startpollers: "20"
zabbix_timeout: "10"
zabbix_cachesize: "256M"
zabbix_historycachesize: "64M"
zabbix_historyindexcachesize: "32M"
zabbix_trendcachesize: "64M"
zabbix_valuecachesize: "128M"

zabbix_ssl_cert_days: "365"
