- name: Install base packages required for repositories
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
- name: Remove old conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true
    autoremove: true
  ignore_errors: true


- name: Create directory for APT keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64'
      else 'arm64' if ansible_architecture in ['aarch64', 'arm64']
      else 'armhf' if ansible_architecture in ['armv7l', 'armhf']
      else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Verify Docker service is active
  ansible.builtin.command: systemctl is-active docker
  register: docker_service_status
  changed_when: false

- name: Show Docker service status
  ansible.builtin.debug:
    msg: "Docker service status: {{ docker_service_status.stdout }}"

- name: Check Docker version
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Show Docker version
  ansible.builtin.debug:
    var: docker_version.stdout

- name: Check Docker Compose version
  ansible.builtin.command: docker compose version
  register: docker_compose_version
  changed_when: false

- name: Show Docker Compose version
  ansible.builtin.debug:
    var: docker_compose_version.stdout
